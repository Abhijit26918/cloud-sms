# Teacher pipeline in namespace "pipeline": an Ollama server (phi3.5) and an Indexed Job of sharded workers.
# Each pod gets SHARD_INDEX from the Job completion index and writes its own object datasets/teacher*/shard-N.jsonl.
# Run:  kubectl apply -f k8s/pipeline/teacher.yaml   (scripts/run_teacher_demo.sh does this and waits)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: pipeline
spec:
  replicas: 1
  selector:
    matchLabels: {app: ollama}
  template:
    metadata:
      labels: {app: ollama}
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:0.5.4
          ports:
            - {containerPort: 11434}
          env:
            - {name: OLLAMA_KEEP_ALIVE, value: "30m"}
          resources:
            requests: {cpu: "1", memory: 3Gi}
            limits: {cpu: "3", memory: 4Gi}
          readinessProbe:
            httpGet: {path: /api/tags, port: 11434}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: pipeline
spec:
  selector: {app: ollama}
  ports:
    - {port: 11434, targetPort: 11434}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: teacher-workers
  namespace: pipeline
spec:
  completions: 2
  parallelism: 2
  completionMode: Indexed
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: worker
          image: teacher-worker:1.0
          imagePullPolicy: IfNotPresent
          env:
            - {name: SHARD_COUNT, value: "2"}
            - name: SHARD_INDEX
              valueFrom: {fieldRef: {fieldPath: "metadata.annotations['batch.kubernetes.io/job-completion-index']"}}
            - {name: INPUT, value: "s3://datasets/commands_pool.jsonl"}
            - {name: OUTPUT_DIR, value: "s3://datasets/teacher-incluster"}
            - {name: LIMIT, value: "25"}      # in-cluster demonstration run (see report); full labelling ran on Kaggle
            - {name: OLLAMA_URL, value: "http://ollama.pipeline.svc.cluster.local:11434"}
            - {name: S3_ENDPOINT, value: "http://seaweedfs.data.svc.cluster.local:8333"}
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: s3-credentials, key: access-key}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: s3-credentials, key: secret-key}}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
